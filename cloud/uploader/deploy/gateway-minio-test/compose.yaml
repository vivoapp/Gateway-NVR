# TEMPORARY test on the gateway: the real uploader image against a throw-away MinIO, until Backblaze B2 is ready.
# Separate project name, separate state, its own passwords. The real /etc/vivo/cloud.env is NOT used, and the
# real uploader stack in ../compose.yaml is not touched. Everything lives in /var/lib/vivo-cloud/minio-test (OS disk).
# Use it through ./test.sh (start, status, stop, clean).
name: vivo-cloud-miniotest

x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  # Gives the state folder to user 10001 (same idea as init-data in ../compose.yaml).
  init:
    profiles: [setup]
    build: {context: ../.., target: runtime}
    image: vivo-cloud-uploader:0.1.0
    user: "0:0"
    entrypoint: ["chown", "-R", "10001:10001", "/base/state"]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    volumes: ["${TEST_BASE}:/base"]
    restart: "no"

  # Removes everything the test wrote (files owned by user 10001 cannot be removed from outside).
  cleaner:
    profiles: [clean]
    image: vivo-cloud-uploader:0.1.0
    user: "0:0"
    entrypoint: ["sh", "-c", "rm -rf /base/state /base/minio-data"]
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    volumes: ["${TEST_BASE}:/base"]
    restart: "no"

  minio:
    <<: *hardening
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}     # test only
    user: "0:0"                          # root inside rootless Docker is still only the haris user
    command: server /data
    env_file: ${TEST_BASE}/minio.env
    volumes: ["${TEST_BASE}/minio-data:/data"]
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 200
    restart: "no"

  create-bucket:
    image: vivo-cloud-uploader:0.1.0
    depends_on: [minio]
    env_file: ${TEST_BASE}/cloud.env
    restart: "no"
    command:
      - python
      - -c
      - |
        import os, time, boto3
        from botocore.config import Config
        c = boto3.client("s3", endpoint_url=os.environ["S3_ENDPOINT_URL"], region_name="us-east-1",
                         aws_access_key_id=os.environ["S3_ACCESS_KEY"],
                         aws_secret_access_key=os.environ["S3_SECRET_KEY"],
                         config=Config(s3={"addressing_style": "path"}, retries={"max_attempts": 1},
                                       connect_timeout=3, read_timeout=10))
        bucket = os.environ["S3_BUCKET"]
        for _ in range(90):
            try:
                try:
                    c.head_bucket(Bucket=bucket)
                except Exception as e:
                    if getattr(e, "response", {}).get("Error", {}).get("Code") not in ("404", "NoSuchBucket", "NotFound"):
                        raise
                    c.create_bucket(Bucket=bucket)
                print("bucket", bucket, "ready")
                break
            except Exception as e:
                print("waiting for MinIO...", type(e).__name__)
                time.sleep(1)
        else:
            raise SystemExit("MinIO did not become ready")

  uploader:
    <<: *hardening
    build: {context: ../.., target: runtime}
    image: vivo-cloud-uploader:0.1.0
    user: "10001:10001"
    depends_on:
      create-bucket: {condition: service_completed_successfully}
    env_file: ${TEST_BASE}/cloud.env
    command: ["python", "-m", "segment_uploader", "run", "--config", "/etc/vivo-uploader/config.toml"]
    volumes:
      # ONE camera only (set TEST_CAMERA), read-only: the test stays small (about 0.6 GB per day of video)
      - ${TEST_RECORDINGS:-/srv/vivo/recordings/substream}/${TEST_CAMERA:-cam01}:/data/recordings/${TEST_CAMERA:-cam01}:ro
      - ${TEST_BASE}/state:/data/state
      - ./config.test.toml:/etc/vivo-uploader/config.toml:ro
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 200
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    restart: "no"
