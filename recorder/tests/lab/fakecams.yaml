# Lab camera inventory: ten fake cameras served by the lab's fakecam container (tests/lab/README.md).
# Same shape as cameras.yaml. The streams are looping test clips, not real cameras.

site:
  record_days: 7
  substream_days: 3
  export_days: 7
  disk_limit_percent: 90
  disk_target_percent: 85
  hwaccel: none                # no Intel GPU in the lab: Frigate decodes on the CPU
  detect:
    width: 640
    height: 360
    fps: 5

cameras:
  - id: cam01
    name: LAB-CAM-01
    host: fakecam
    port: 8554
    main_path: /cam01_main
    sub_path: /cam01_sub
    credentials: LABCAM
    audio: aac

