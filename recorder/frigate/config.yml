# GENERATED by tools/gen_config.py from cameras.yaml. Do not edit by hand.
# Frigate records each camera's main stream continuously from go2rtc.
# Detection, snapshots, audio events, Birdseye and all AI features are off.
# The detect input (substream) is still decoded at low resolution because
# Frigate needs it for motion and stats; decoding uses Intel VAAPI.
# The file is mounted read-only, so settings cannot be changed in the UI.

version: 0.18-0
mqtt:
  enabled: false
telemetry:
  version_check: false
birdseye:
  enabled: false
audio:
  enabled: false
semantic_search:
  enabled: false
face_recognition:
  enabled: false
lpr:
  enabled: false
snapshots:
  enabled: false
ffmpeg:
  hwaccel_args: preset-intel-qsv-h265
detect:
  enabled: false
  width: 640
  height: 360
  fps: 5
record:
  enabled: true
  continuous:
    days: 7
  motion:
    days: 0
cameras:
  cam01:
    friendly_name: VIVO-CAM-01
    ffmpeg:
      inputs:
      - path: rtsp://{FRIGATE_GO2RTC_RTSP_USER}:{FRIGATE_GO2RTC_RTSP_PASSWORD}@go2rtc:8554/cam01_main
        input_args: preset-rtsp-restream
        roles:
        - record
      - path: rtsp://{FRIGATE_GO2RTC_RTSP_USER}:{FRIGATE_GO2RTC_RTSP_PASSWORD}@go2rtc:8554/cam01_sub
        input_args: preset-rtsp-restream
        roles:
        - detect
      output_args:
        record: preset-record-generic-audio-aac
