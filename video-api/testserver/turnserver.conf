# coturn for Vivo live view (M15). /etc/turnserver.conf on the test server (docs/turn-runbook.md).
# Replace the two @...@ values. Production follows the same file with TLS added (see the runbook).
listening-port=3478
fingerprint
realm=vivo-turn

# The Video API makes per-session credentials with this shared secret (TURN_SECRET in video-api.env).
use-auth-secret
static-auth-secret=@TURN_SECRET@

# The full relay port range: relay ports are handed out again, and a large range keeps a just-cut
# viewer's port from going straight to the next viewer (docs/findings.md F4).
min-port=49152
max-port=65535

# The server's public address, when its network interface has a private one (most clouds).
external-ip=@PUBLIC_IP@

# Relay only to public addresses: never into the server's own or any private network.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255

# Limits: sessions per user name (one per live session) and in total.
user-quota=4
total-quota=200
stale-nonce=600
no-cli
no-tlsv1
no-tlsv1_1
simple-log
syslog
